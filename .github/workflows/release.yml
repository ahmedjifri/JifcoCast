name: Build release APK

on:
  push:
    branches: ["main"]
    paths: ["app/**", "shared/**", "gradle/**", "*.gradle.kts", ".github/workflows/release.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Restore signing key
        run: |
          mkdir -p keys
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > keys/jifcocast.jks
          cat > keystore.properties <<EOT
          storeFile=keys/jifcocast.jks
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOT

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleRelease

      - name: Rename APK and read version
        id: ver
        run: |
          cp app/build/outputs/apk/release/app-release.apk JifcoCast.apk
          V=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: JifcoCast-apk
          path: JifcoCast.apk

      - name: Create GitHub Release (tag = versionName)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: Jifco Cast ${{ steps.ver.outputs.version }}
          files: JifcoCast.apk
